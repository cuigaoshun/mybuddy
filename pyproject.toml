[project]
name = "mybuddy"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "apscheduler>=3.10,<4",
    "dependency-injector>=4.49.1,<5",
    "dynaconf>=3.2.11",
    "fastapi>=0.138.1",
    "langchain>=1.3.11",
    "langchain-core>=1.4.8",
    "langchain-openai>=1.3.3",
    "langgraph>=1.2.7",
    "lark-oapi>=1.7.0",
    "loguru>=0.7.3",
    "exa-py>=1.14.20",
    "pgvector>=0.4.1",
    "pydantic>=2.13.4",
    "psycopg[binary]>=3.2.9",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.41",
    "sentence-transformers>=5.0.0",
    "torch>=2.0.0",
    "uvicorn>=0.49.0",
    "uuid6>=2025.0.1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
